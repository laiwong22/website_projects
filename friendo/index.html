<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friendo</title>
  <meta name="description" content="Friendo keeps track of your friends, invites, gifts and kind acts, and holds your journal.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c4553a'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Georgia'%3EF%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#friends"><span class="logo" aria-hidden="true">F</span>Friendo</a>
      <nav class="tabs" aria-label="Sections">
        <a href="#friends" data-tab="friends">Friends</a>
        <a href="#history" data-tab="history">History</a>
        <a href="#invites" data-tab="invites">Invites</a>
        <a href="#calendar" data-tab="calendar">Calendar</a>
        <a href="#ideas" data-tab="ideas">Ideas</a>
        <a href="#journal" data-tab="journal">Journal</a>
      </nav>
      <div class="top-actions">
        <button id="pending" class="pending" data-act="save" hidden></button>
        <button class="icon gear" data-act="settings" aria-label="Settings and saving">⚙</button>
      </div>
    </div>
  </header>

  <main id="view" class="wrap"></main>

  <dialog id="modal"><div id="modal-body"></div></dialog>
  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="data/friends.js"></script>
  <script src="data/moments.js"></script>
  <script src="data/journal.js"></script>
  <script src="data/priorities.js"></script>
  <script src="app.js"></script>
</body>
</html>
