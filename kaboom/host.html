<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15112a">
  <title>Kaboom! Host a game</title>
  <meta name="description" content="Run a Kaboom quiz on the big screen while players answer on their phones.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='19' r='11' fill='%2315112a'/%3E%3Cpath d='M21 10 Q25 4 29 5' stroke='%23ff6b2c' stroke-width='3' fill='none'/%3E%3Ccircle cx='29' cy='4' r='3' fill='%23ffd23f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/kaboom.css">
</head>
<body class="host setup-mode">
  <header class="topbar">
    <a class="logo" href="./" title="Player join page">KAB<span class="o">OO</span>M!</a>
    <span id="pin-pill" class="pin-pill" hidden></span>
    <span class="spacer"></span>
    <span id="q-pill" class="count-pill" hidden></span>
    <span id="count-pill" class="count-pill" hidden></span>
    <button class="icon-btn" id="mute" type="button" title="Mute or unmute (M)" aria-label="Mute">🔊</button>
    <button class="icon-btn" id="fs" type="button" title="Full screen (F)" aria-label="Full screen">⛶</button>
  </header>
  <main id="stage"></main>
  <div id="blast-layer" aria-hidden="true"></div>
  <dialog id="results" class="results"></dialog>
  <div id="banner" class="banner" role="alert" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/peerjs.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/modes.js"></script>
  <script src="js/modes/favorite-rules.js"></script>
  <script src="js/modes/favorite.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/host.js"></script>
</body>
</html>
